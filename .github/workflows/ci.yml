name: CI / Automated Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Lint, Typecheck, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Code Style (Prettier)
        run: npm run format:check

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: ESLint Code Quality
        run: npm run lint

      - name: Production Bundle Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8001
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key

  backend:
    name: Backend ML & API (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
          pip install -r ml/assistant/requirements.txt pytest pytest-cov

      - name: Run Pytest Suite
        run: python -m pytest ml/tests -v
        env:
          FAILURE_THRESHOLD: '0.50'
          HEALTH_FAILURE_WEIGHT: '0.60'
          HEALTH_ANOMALY_WEIGHT: '0.40'
          HEALTHY_SCORE_THRESHOLD: '70'
          WARNING_SCORE_THRESHOLD: '40'
          MODEL_DIR: './ml/models'
